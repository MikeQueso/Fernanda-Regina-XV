# Los proyectos gratuitos de Supabase se pausan tras ~7 días sin actividad,
# y al pausarse la invitación deja de guardar fotos y confirmaciones.
# Esto le manda una petición cada 3 días para mantenerlo despierto.
#
# La clave que usa es la publicable, la misma que ya va en js/supabase-config.js
# y que es pública por diseño. Aquí no hay ningún secreto.

name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 13 */3 * *'   # cada 3 días, 13:00 UTC
  workflow_dispatch:          # y a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el proyecto
        run: |
          URL="https://yhywubvveqnlgpkhrdgz.supabase.co"
          KEY="sb_publishable_ZP2257ZkDMN9FOaPgp51Mw_iXpGwOaR"

          # Se consulta el bucket del álbum: es una petición real que
          # responde 200. La raíz de /rest/v1/ devuelve 401 con la clave
          # publicable, así que no sirve para comprobar que está vivo.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "$URL/storage/v1/object/list/album" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"fotos/","limit":1,"offset":0}')

          echo "Respuesta de Supabase: HTTP $code"

          if [ "$code" != "200" ]; then
            echo "::error::El proyecto no respondió correctamente (HTTP $code). Puede estar pausado; revísalo en el panel de Supabase."
            exit 1
          fi

          echo "Proyecto activo."
